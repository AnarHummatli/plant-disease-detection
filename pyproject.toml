[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plantdx"
version = "1.2.0"
description = "Plant disease detection from leaf images: leakage-free evaluation, MobileNet transfer learning, Grad-CAM, browser and Gradio demos."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anar Hummatli" }]
# 3.11+: the released model needs Keras >= 3.13, which needs Python >= 3.11 (D-021)
requires-python = ">=3.11"
# TensorFlow is NOT a core dependency on purpose: Colab and Kaggle ship a
# CUDA-matched TensorFlow, and reinstalling it there can break the GPU setup.
# Install it locally with:  pip install -e ".[tf]"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
tf = ["tensorflow>=2.19", "keras>=3.13"]
# CPU-only TensorFlow for CI: runs the pipeline tests without CUDA libraries
cpu = ["tensorflow-cpu>=2.19", "keras>=3.13"]
# the demo uses the Gradio 6 API (theme and css passed to launch)
demo = ["gradio>=6.0", "keras>=3.13"]
# browser demo build (plantdx.web_export): Keras -> ONNX, checked with ONNX Runtime
web = ["tf2onnx>=1.17", "onnxruntime>=1.20"]
# ruff is pinned so CI, pre-commit and local runs format code identically
dev = ["pytest>=8.0", "ruff==0.17.5", "pre-commit>=3.7", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # TensorFlow's autograph (via gast) triggers Python 3.13+ AST deprecation notices
    "ignore::DeprecationWarning:gast.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
