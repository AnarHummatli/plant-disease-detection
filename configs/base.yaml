# Shared settings. Every experiment config (cnn.yaml, mobilenetv2_head.yaml, ...)
# starts from these values and overrides only what differs (plan 9.1).

seed: 42

data:
  hf_repo: mohanty/PlantVillage
  variant: color            # color | grayscale | segmented (segmented = B part, E6)
  val_fraction: 0.15        # carved out of the official train split, grouped by group_id
  image_size: 224
  num_classes: 38
  cache_eval: memory        # val/test decoded once, kept as uint8 (~2.5 GB in RAM)
  cache_train: disk         # null | memory | disk (~5.5 GB under PLANTDX_CACHE, /content/cache on Colab)

augment:                    # training only (plantdx.data.pipeline.AugmentConfig); where: train.augment_on
  flip: horizontal_and_vertical
  rotation_deg: 20
  zoom: 0.15
  brightness: 0.15
  contrast: 0.15

train:
  batch_size: 64
  augment_on: model         # model = first layers of the model, on the GPU (D-008); or pipeline
  mixed_precision: false

paths:
  # Relative paths resolve against PLANTDX_ARTIFACTS (Drive on Colab) or ./artifacts locally.
  artifacts: artifacts
  splits: splits
  figures: reports/figures
  results_csv: reports/results.csv
