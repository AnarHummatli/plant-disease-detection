name: Browser demo (GitHub Pages)

# Builds the static browser demo from the release model (plantdx.web_export: download with
# SHA-256 check, ONNX export checked against Keras) and publishes it on GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "app/web/**"
      - "app/gradio/examples/**"
      - "src/plantdx/web_export.py"
      - "src/plantdx/predict.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[cpu,web]"
      - name: Build the site
        run: python -m plantdx.web_export --out build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
